[project]
name = "livekit-transcript"
version = "0.1.0"
description = "Realtime per-speaker transcription of LiveKit rooms"
readme = "README.md"
authors = [
    { name = "mogafk", email = "mogafk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "livekit>=1.2.0",
    "livekit-api>=1.2.2",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.4,<12.9.3",
    "nvidia-cudnn-cu12>=9,<10",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
livekit-transcript = "livekit_transcript.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# GPU tests: uv run pytest -m gpu
addopts = "-m 'not gpu'"
markers = ["gpu: needs a CUDA GPU, the Whisper model and samples/*.wav"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
